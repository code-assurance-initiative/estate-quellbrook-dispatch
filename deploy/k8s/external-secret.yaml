# Credentials live in the platform's secret store; External Secrets Operator materialises them as Kubernetes Secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quellbrook-dispatch-db
  namespace: quellbrook-dispatch
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: quellbrook-vault
  target:
    name: quellbrook-dispatch-db
  data:
    - secretKey: connection-string
      remoteRef:
        key: dispatch/postgres
        property: connection-string
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quellbrook-dispatch-broker
  namespace: quellbrook-dispatch
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: quellbrook-vault
  target:
    name: quellbrook-dispatch-broker
  data:
    - secretKey: username
      remoteRef:
        key: dispatch/rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: dispatch/rabbitmq
        property: password
